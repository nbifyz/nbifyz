hooks:
  before_constitution:
    - id: pre_constitution
      enabled: true
      optional: false
      extension: "your-extension"
      command: "pre_constitution"
      description: "Run before /speckit.constitution"

  after_constitution:
    - id: post_constitution
      enabled: true
      optional: true
      extension: "your-extension"
      command: "post_constitution"
      description: "Run after /speckit.constitution"
      prompt: "Run post-constitution hook?"

  before_specify:
